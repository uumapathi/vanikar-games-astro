<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting to Sleep — Card Games by Vanikar</title>
<!-- Seep was replaced by Sleep, the game the engine implements. Hand-written
     rather than using Astro's `redirects` config, whose generated page adds a
     robots noindex; that made Search Console report this URL as excluded and
     stopped it consolidating into /games/sleep/. Keep this page indexable so
     Google follows the redirect and passes the signal on. -->
<meta http-equiv="refresh" content="0;url=/games/sleep/">
<link rel="canonical" href="https://vanikar.games/games/sleep/">
</head>
<body>
<p>This game is now called <a href="/games/sleep/">Sleep</a>. Redirecting…</p>
</body>
</html>
